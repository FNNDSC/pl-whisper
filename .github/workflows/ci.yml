# Lint and test on every push and pull request; build the container image on every
# push to main and on a version tag, push it to docker.io and ghcr.io, and keep the
# plugin's description as a build artifact for registering it on a CUBE by hand.
# Uploading to cube.chrisproject.org is not done yet: the plugin is registered on
# BCH's CUBE first.

name: ci

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and test (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python style_check.py pl_whisper tests
      - run: pytest -q

  build:
    name: Build and publish the image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Decide image tags
        id: info
        shell: python
        run: |
          import os
          import itertools

          def join_tag(t):
            registry, repo, tag = t
            return f'{registry}/{repo}:{tag}'.lower()

          registries = ['docker.io', 'ghcr.io']
          repos = ['${{ github.repository }}']
          if '${{ github.ref_type }}' == 'branch':
              tags = ['latest']
          elif '${{ github.ref_type }}' == 'tag':
              tag = '${{ github.ref_name }}'
              version = tag[1:] if tag.startswith('v') else tag
              tags = ['latest', version]
          else:
              tags = []

          if '${{ github.ref_type }}' == 'tag':
              local_tag = join_tag(('ghcr.io', '${{ github.repository }}', version))
          else:
              local_tag = join_tag(('localhost', '${{ github.repository }}', 'latest'))

          product = itertools.product(registries, repos, tags)
          tags_csv = ','.join(map(join_tag, product))
          outputs = {
              'tags_csv' : tags_csv,
              'push'     : 'true' if tags_csv else 'false',
              'local_tag': local_tag
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for k, v in outputs.items():
                  out.write(f'{k}={v}\n')

      - uses: actions/checkout@v4
        # cuBLAS, cuDNN and the model make an image of some six gigabytes, built twice
        # (load, then push); the runner's disk needs its preinstalled toolchains gone.
      - name: Free disk space on the runner
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build (local only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.info.outputs.local_tag }}
          load: true
          cache-from: type=gha

      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          expected="v$(python3 -c 'import re, pathlib; print(re.search(r"__version__: str = \"([^\"]+)\"", pathlib.Path("pl_whisper/__init__.py").read_text()).group(1))')"
          test "${GITHUB_REF_NAME}" = "${expected}" || { echo "tag ${GITHUB_REF_NAME} != ${expected}"; exit 1; }

      - name: Run the image
        run: |
          dock_image=${{ steps.info.outputs.local_tag }}
          docker run --rm $dock_image pl-whisper --version
          docker run --rm $dock_image pl-whisper --man > /dev/null
          docker run --rm $dock_image whisper-transcribe --help > /dev/null
          docker run --rm $dock_image sh -c 'test -s "$WHISPER_MODEL/model.bin"'
          # The image holds two ChRIS plugin distributions, pl-whisper and the shexec it is
          # built on, so chris_plugin_info must be told which.
          docker run --rm $dock_image chris_plugin_info --dock-image $dock_image pl-whisper > plugin-description.json

      - name: Read the plugin's title
        id: title
        run: echo "title=$(jq -r .title plugin-description.json)" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        if: contains(steps.info.outputs.tags_csv, 'docker.io')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Login to GitHub Container Registry
        if: contains(steps.info.outputs.tags_csv, 'ghcr.io')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.info.outputs.tags_csv }}
          platforms: linux/amd64
          push: ${{ steps.info.outputs.push }}
          cache-to: type=gha,mode=max

      - name: Keep the plugin's description
        uses: actions/upload-artifact@v4
        with:
          name: plugin-description
          path: plugin-description.json

      - name: Update DockerHub description
        if: github.ref_type == 'tag'
        uses: peter-evans/dockerhub-description@v3
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          short-description: ${{ steps.title.outputs.title }}
          readme-filepath: ./README.rst
